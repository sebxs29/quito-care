<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <!-- Responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QuitoCare</title>

  <!-- Optimización de fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Google Fonts (Poppins) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

  <!-- Normalize (reset profesional) -->
  <link rel="stylesheet" href="src/css/normalize.css">

  <!-- CSS principal -->
  <link rel="stylesheet" href="src/css/styles.css">

  <!-- Favicon -->
  <link rel="shortcut icon" href="./src/images/favicon.png" type="image/x-icon">
</head>
<body>

  <!-- 🔹 INICIO INTEGRANTE 1 -->
  <header class="header">
    <nav class="nav__header">
      <h1 class="navbar_logo">Quito<span class="navbar__logo--primary">Care</span></h1>
      
      <!-- Botón hamburguesa (para mobile) -->
      <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
      
      <ul class="nav__menu" id="navMenu">
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Servicios</a></li>
        <li><a href="#">Como funciona</a></li>
        <li><a href="#">Nosotros</a></li>
        <li><a href="#">Contacto</a></li>
        <li><button class="nav__login-btn">Login</button></li>
      </ul>
    </nav>
  </header>

  <section id="hero" class="hero">
    <div class="hero__container">
      
      <!-- Columna izquierda: texto -->
      <div class="hero__content">
        <p class="hero__subtitle">
          Telemedicina en Quito <br>
          <span class="hero__highlight">fácil y rápida</span>
        </p>
        <p class="hero__description">
          Agenda tu cita médica sin salir de casa y recibe atención de profesionales certificados.
        </p>
        <button class="hero__button">Agendar cita</button>
      </div>

      <!-- Columna derecha: imagen -->
      <div class="hero__image">
        <img src="./src/images/hero.png" alt="hero" loading="lazy">
      </div>
      
    </div>
  </section>
  <!-- 🔹 FIN INTEGRANTE 1 -->


<!-- 🔹 INICIO INTEGRANTE 2 -->
<section id="services" class="services"></section>
<!-- 🔹 FIN INTEGRANTE 2 -->


<!-- 🔹 INICIO INTEGRANTE 3 -->
<section id="about" class="about"></section>
<section id="cta" class="cta"></section>
<!-- 🔹 FIN INTEGRANTE 3 -->


<!-- 🔹 SCRUM MASTER (TÚ) -->
<footer class="footer"></footer>
<!-- 🔹 FIN SCRUM MASTER -->
  
</body>
</html>
